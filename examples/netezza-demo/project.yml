# WishBridge example: Netezza -> Databricks. Paths are relative to this file.
name: netezza-demo
source: netezza
input: input
output: output

databricks:
  profile: DEFAULT
  warehouse_id: ""          # blank = first running SQL warehouse
  catalog: workspace        # default catalog on newer workspaces (older ones use `main`)
  schema: wishbridge_netezza

schema_map:
  SALES: workspace.wishbridge_netezza

# Demo source: workspace.wishbridge_netezza_src, created by `wishbridge sql setup_demo_source.sql`.
# In a real project source_catalog is a Lakehouse Federation catalog pointing at the Netezza database.
data:
  method: federation
  source_catalog: workspace
  mode: overwrite
  tables:
    - {source: wishbridge_netezza_src.CUSTOMERS, target: workspace.wishbridge_netezza.CUSTOMERS}
    - {source: wishbridge_netezza_src.ORDERS, target: workspace.wishbridge_netezza.ORDERS}
