# WishBridge as a Databricks App (option 3). deploy-databricks-app.ps1 fills in the volume and deploys it.
command: ["python", "app_main.py"]
env:
  # Where the app keeps the projects (one zip each), so nothing is lost when the app restarts.
  - name: WISHBRIDGE_PROJECTS_VOLUME
    value: "__PROJECTS_VOLUME__"
  # The SQL warehouse given to the app as a resource named "sql-warehouse".
  - name: WISHBRIDGE_WAREHOUSE_ID
    valueFrom: "sql-warehouse"
