# WishBridge as a Databricks App (option 3).
# Read by Databricks from the root of the repository - for a Git deployment (Apps > Deploy from Git) and for
# deploy-databricks-app.ps1, which writes the client's own values over the defaults below.
command: ["python", "databricks_app/app_main.py"]
env:
  # Where the app keeps the projects (one zip each), so nothing is lost when the app restarts.
  # Default: Wishtree's test workspace. For another workspace use the deploy script, or change it here.
  - name: WISHBRIDGE_PROJECTS_VOLUME
    value: "/Volumes/workspace/wishbridge/projects"
  # Groups (comma-separated) that get every privilege on the test schemas the app creates, besides the person
  # using the app. Empty: only that person.
  - name: WISHBRIDGE_SHARE_WITH
    value: ""
  # Claude through an Anthropic API key kept as a Databricks secret: "scope/key" (empty: not used). The deploy
  # script fills it in with -ClaudeKeySecret and lets the app read that secret.
  - name: WISHBRIDGE_CLAUDE_SECRET
    value: ""
  # The Databricks secret scope that keeps the AI keys pasted in Fix code (anthropic-api-key, gemini-api-key,
  # openai-api-key) so they survive a restart. The deploy script creates it and lets the app write to it.
  - name: WISHBRIDGE_AI_SECRET_SCOPE
    value: "wishbridge"
  # The SQL warehouse given to the app as a resource named "sql-warehouse".
  - name: WISHBRIDGE_WAREHOUSE_ID
    valueFrom: "sql-warehouse"
