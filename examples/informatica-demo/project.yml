# WishBridge example: Informatica PowerCenter -> Databricks. Paths are relative to this file.
name: informatica-demo
source: informatica
input: input
output: output

databricks:
  profile: DEFAULT
  warehouse_id: ""          # blank = first running SQL warehouse
  catalog: workspace        # default catalog on newer workspaces (older ones use `main`)
  schema: wishbridge_informatica

schema_map:
  SALES: workspace.wishbridge_informatica

# Demo source: workspace.wishbridge_informatica_src, created by `wishbridge sql setup_demo_source.sql`.
# In a real project source_catalog is a Lakehouse Federation catalog pointing at the Informatica PowerCenter database.
data:
  method: federation
  source_catalog: workspace
  mode: overwrite
  tables:
    - {source: wishbridge_informatica_src.ORDERS, target: workspace.wishbridge_informatica.ORDERS}
    - {source: wishbridge_informatica_src.ORDERS_CLEAN, target: workspace.wishbridge_informatica.ORDERS_CLEAN, load: false}   # legacy output vs the migrated notebook's output
